<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fafafa;
      color: #111;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .box {
      width: 100%;
      max-width: 380px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }

    .sub {
      color: #6b7280;
      font-size: 0.95rem;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: #6b7280;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      font-size: 0.95rem;
      color: #111;
      background: #fff;
      outline: none;
      font-family: inherit;
    }

    .form-group input:focus {
      border-color: #2563eb;
    }

    .error {
      background: #fef2f2;
      color: #dc2626;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
      margin-bottom: 14px;
      display: none;
    }

    .success {
      background: #f0fdf4;
      color: #16a34a;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
      margin-bottom: 14px;
      display: none;
    }

    .btn {
      width: 100%;
      padding: 13px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      margin-top: 4px;
    }

    .btn:hover { opacity: 0.9; }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Google button */
    .btn-google {
      width: 100%;
      padding: 12px;
      background: #fff;
      color: #111;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      transition: background 0.15s;
    }

    .btn-google:hover {
      background: #f9fafb;
    }

    .btn-google svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      color: #9ca3af;
      font-size: 0.8rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }

    .switch {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: #6b7280;
    }

    .switch a {
      color: #2563eb;
      font-weight: 600;
      text-decoration: none;
    }

    .switch a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Create account</h1>
    <p class="sub">Sign up to get started</p>

    <div class="error" id="error"></div>
    <div class="success" id="success"></div>

    <button class="btn-google" onclick="handleGoogleSignup()">
      <svg viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>

    <div class="divider">or</div>

    <div class="form-group">
      <label>Full name</label>
      <input type="text" id="name" placeholder="Your full name" autocomplete="name">
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@email.com" autocomplete="email">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="At least 4 characters" autocomplete="new-password">
    </div>

    <button class="btn" id="submitBtn" onclick="handleSignup()">Create account</button>

    <p class="switch">
      Already have an account? <a href="signin.html">Sign in</a>
    </p>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script>

    const API_URL = 'https://your-backend.com/api/auth/signup';
    const GOOGLE_API_URL = 'https://your-backend.com/api/auth/google';
    const GOOGLE_CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com';  // ← change this

    // ---------- EMAIL SIGN UP ----------
    async function handleSignup() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const errorBox = document.getElementById('error');
      const successBox = document.getElementById('success');
      const btn = document.getElementById('submitBtn');

      errorBox.style.display = 'none';
      successBox.style.display = 'none';

      if (!name || !email || !password) {
        errorBox.textContent = 'Please fill in all fields.';
        errorBox.style.display = 'block';
        return;
      }

      if (password.length < 4) {
        errorBox.textContent = 'Password must be at least 4 characters.';
        errorBox.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating account...';

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          throw new Error(data.message || data.error || 'Something went wrong.');
        }

        successBox.textContent = 'Account created! Redirecting...';
        successBox.style.display = 'block';

        setTimeout(() => {
          window.location.href = 'signin.html';
        }, 1500);

      } catch (err) {
        if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
          errorBox.textContent = 'Cannot connect to server. Backend may not be ready yet.';
        } else {
          errorBox.textContent = err.message;
        }
        errorBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Create account';
      }
    }

    // ---------- GOOGLE SIGN UP ----------
    function handleGoogleSignup() {
      const errorBox = document.getElementById('error');
      errorBox.style.display = 'none';

      if (!GOOGLE_CLIENT_ID || GOOGLE_CLIENT_ID.includes('YOUR_GOOGLE')) {
        errorBox.textContent = 'Google Sign Up is not set up yet. Add your Google Client ID.';
        errorBox.style.display = 'block';
        return;
      }

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: onGoogleResponse
      });

      google.accounts.id.prompt((notification) => {
        if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
          // Fallback: show One Tap didn't work, try popup style
          google.accounts.id.renderButton(
            document.createElement('div'),
            { theme: 'outline', size: 'large' }
          );
          // Direct oauth token client as backup
          const client = google.accounts.oauth2.initTokenClient({
            client_id: GOOGLE_CLIENT_ID,
            scope: 'email profile',
            callback: async (tokenResponse) => {
              if (tokenResponse.access_token) {
                await sendGoogleToken(tokenResponse.access_token, 'access_token');
              }
            }
          });
          client.requestAccessToken();
        }
      });
    }

    async function onGoogleResponse(response) {
      // response.credential is the ID token
      await sendGoogleToken(response.credential, 'id_token');
    }

    async function sendGoogleToken(token, type) {
      const errorBox = document.getElementById('error');
      const successBox = document.getElementById('success');

      errorBox.style.display = 'none';
      successBox.style.display = 'none';

      try {
        const body = type === 'id_token'
          ? { credential: token }
          : { access_token: token };

        const res = await fetch(GOOGLE_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          throw new Error(data.message || data.error || 'Google sign up failed.');
        }

        successBox.textContent = 'Signed up with Google! Redirecting...';
        successBox.style.display = 'block';

        setTimeout(() => {
          window.location.href = 'signin.html';  // or dashboard.html
        }, 1500);

      } catch (err) {
        if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
          errorBox.textContent = 'Cannot connect to server. Backend may not be ready yet.';
        } else {
          errorBox.textContent = err.message;
        }
        errorBox.style.display = 'block';
      }
    }

    // Enter key submits email form
    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSignup();
      });
    });
  </script>
</body>
</html>
